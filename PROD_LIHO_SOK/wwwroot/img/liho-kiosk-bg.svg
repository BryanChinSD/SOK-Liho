<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D3281B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91D13;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="topGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#E63946;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="bottomGlow" cx="80%" cy="80%" r="50%">
      <stop offset="0%" style="stop-color:#FFB4B4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#D3281B;stop-opacity:0" />
    </radialGradient>

    <pattern id="bubbles" x="0" y="0" width="300" height="300" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="4" fill="white" opacity="0.08"/>
      <circle cx="120" cy="80" r="5" fill="white" opacity="0.06"/>
      <circle cx="220" cy="140" r="3" fill="white" opacity="0.09"/>
      <circle cx="270" cy="220" r="4.5" fill="white" opacity="0.07"/>
      <circle cx="80" cy="260" r="3.5" fill="white" opacity="0.1"/>
      <circle cx="180" cy="50" r="5.5" fill="white" opacity="0.05"/>
    </pattern>

    <path id="wave" d="M0,50 Q150,30 300,50 T600,50" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="2"/>
  </defs>

  <rect width="1920" height="1080" fill="url(#mainGradient)"/>
  
  <ellipse cx="384" cy="216" rx="600" ry="450" fill="url(#topGlow)"/>
  <ellipse cx="1536" cy="864" rx="650" ry="500" fill="url(#bottomGlow)"/>

  <rect width="1920" height="1080" fill="url(#bubbles)"/>

  <g opacity="0.12">
    <use href="#wave" x="100" y="200"/>
    <use href="#wave" x="200" y="280"/>
    <use href="#wave" x="50" y="400"/>
    <use href="#wave" x="800" y="150"/>
    <use href="#wave" x="900" y="600"/>
    <use href="#wave" x="1100" y="800"/>
  </g>

  <g opacity="0.08" fill="#ffffff">
    <path d="M 200,450 L 230,550 L 340,550 L 370,450 Z"/>
    <ellipse cx="285" cy="450" rx="85" ry="18"/>
    <rect x="240" y="550" width="90" height="12" rx="6"/>
    
    <path d="M 1480,700 L 1510,800 L 1620,800 L 1650,700 Z"/>
    <ellipse cx="1565" cy="700" rx="85" ry="18"/>
    <rect x="1520" y="800" width="90" height="12" rx="6"/>
  </g>

  <g opacity="0.12" fill="#ffffff">
    <ellipse cx="1600" cy="200" rx="65" ry="28" transform="rotate(-30 1600 200)"/>
    <ellipse cx="1550" cy="160" rx="50" ry="22" transform="rotate(20 1550 160)"/>
    <ellipse cx="1680" cy="180" rx="55" ry="25" transform="rotate(-50 1680 180)"/>
    <ellipse cx="1620" cy="250" rx="48" ry="20" transform="rotate(35 1620 250)"/>
    
    <ellipse cx="280" cy="880" rx="60" ry="26" transform="rotate(40 280 880)"/>
    <ellipse cx="340" cy="930" rx="52" ry="23" transform="rotate(-25 340 930)"/>
    <ellipse cx="220" cy="900" rx="56" ry="27" transform="rotate(65 220 900)"/>
    <ellipse cx="300" cy="820" rx="45" ry="19" transform="rotate(-10 300 820)"/>
  </g>

  <g opacity="0.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <path d="M 250,430 Q 260,390 250,350 Q 240,310 250,270">
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="d" 
               values="M 250,430 Q 260,390 250,350 Q 240,310 250,270;
                       M 250,430 Q 245,390 255,350 Q 265,310 250,270;
                       M 250,430 Q 260,390 250,350 Q 240,310 250,270"
               dur="3s" repeatCount="indefinite"/>
    </path>
    
    <path d="M 300,430 Q 310,400 300,370 Q 290,340 300,310">
      <animate attributeName="opacity" values="0.15;0.3;0.15" dur="3.5s" repeatCount="indefinite"/>
    </path>
    
    <path d="M 1530,680 Q 1540,640 1530,600 Q 1520,560 1530,520">
      <animate attributeName="opacity" values="0.12;0.28;0.12" dur="4.5s" repeatCount="indefinite"/>
    </path>
    
    <path d="M 1590,680 Q 1600,650 1590,620 Q 1580,590 1590,560">
      <animate attributeName="opacity" values="0.18;0.32;0.18" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <circle cx="450" cy="850" r="10" fill="#ffffff" opacity="0.25">
      <animate attributeName="cy" from="850" to="150" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.4;0.25" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="10;12;10" dur="9s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="1450" cy="920" r="8" fill="#ffffff" opacity="0.2">
      <animate attributeName="cy" from="920" to="250" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.35;0.2" dur="11s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="800" cy="980" r="12" fill="#ffffff" opacity="0.22">
      <animate attributeName="cy" from="980" to="200" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0.38;0.22" dur="13s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="1250" cy="1020" r="9" fill="#ffffff" opacity="0.28">
      <animate attributeName="cy" from="1020" to="300" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.28;0.42;0.28" dur="10s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="650" cy="900" r="11" fill="#ffffff" opacity="0.24">
      <animate attributeName="cy" from="900" to="180" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.24;0.4;0.24" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.06">
    <circle cx="960" cy="540" r="380" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="960" cy="540" r="310" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="960" cy="540" r="240" fill="none" stroke="#ffffff" stroke-width="1"/>
  </g>

  <g opacity="0.3" fill="#ffffff">
    <circle cx="600" cy="300" r="3">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1300" cy="400" r="2.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="600" r="3.5">
      <animate attributeName="opacity" values="0.25;0.75;0.25" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1500" cy="500" r="2">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>